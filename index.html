<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101012"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CINEMA">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>CINEMA</title>
<style>
:root{color-scheme:dark;--bg:#101012;--panel:#1b1b1f;--panel2:#25252b;--text:#f7f7f8;--muted:#a1a1aa;--line:#303036;--accent:#ededf0;--gold:#e5b85c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#101012ed;backdrop-filter:blur(18px);padding:calc(13px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid #ffffff0d}.top{display:flex;align-items:center;justify-content:space-between;max-width:900px;margin:auto}.brand{font-size:24px;letter-spacing:3px;font-weight:800}.brand span{color:#999}.tag{font-size:9px;letter-spacing:1.7px;color:var(--muted);margin-top:2px}
main{max-width:900px;margin:auto;padding:20px 16px}.hero{padding:10px 2px 18px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:1.8px;text-transform:uppercase}.hero h1{font-size:32px;letter-spacing:-1.1px;margin:8px 0}.hero p{color:var(--muted);margin:0;line-height:1.5}
.search{display:flex;gap:9px;background:var(--panel);border:1px solid var(--line);padding:12px 14px;border-radius:15px;margin:14px 0}.search input{background:none;border:0;outline:0;color:var(--text);width:100%;font-size:15px}
.filters{display:flex;gap:8px;overflow:auto;padding:3px 0 14px;scrollbar-width:none}.chip{border:1px solid var(--line);background:transparent;color:#c9c9ce;padding:9px 14px;border-radius:30px;white-space:nowrap;font-size:13px}.chip.active{background:#f0f0f2;color:#141416;border-color:#f0f0f2}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 13px}.sectionhead h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0;background:var(--panel);border:1px solid #ffffff0b;border-radius:16px;overflow:hidden}.poster{width:100%;aspect-ratio:2/2.9;object-fit:cover;display:block;background:linear-gradient(145deg,#454550,#17171c)}.poster.placeholder{display:flex;align-items:end;padding:13px;background:linear-gradient(145deg,#596878,#161820);font-size:22px;font-weight:800}.info{padding:11px}.title{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px;margin-top:10px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 10px;border-radius:10px;font-size:12px;flex:1}.btn.primary{background:#ededf0;color:#111;border-color:#ededf0;font-weight:650}.btn:disabled{opacity:.5}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#17171bed;backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}nav button{background:none;border:0;color:var(--muted);padding:7px 10px;border-radius:12px;min-width:65px;font-size:11px}nav button b{display:block;font-size:18px;font-weight:500;margin-bottom:3px}nav button.active{color:#fff;background:#ffffff12}
.empty{padding:30px 16px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:var(--panel);padding:15px 12px;border-radius:14px}.stat strong{font-size:23px;display:block}.stat span{font-size:11px;color:var(--muted)}.profilebox,.panel{background:linear-gradient(135deg,#25252b,#17171a);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.avatar{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:#e9e9ed;color:#111;font-size:23px;font-weight:800;margin-bottom:12px}
.field{width:100%;padding:12px;background:#29292f;border:1px solid var(--line);border-radius:10px;color:white;font-size:14px;margin:6px 0 10px}.label{display:block;color:var(--muted);font-size:12px;margin-top:8px}.notice{padding:12px;background:#24242a;border:1px solid var(--line);border-radius:12px;color:#c7c7ce;font-size:12px;line-height:1.5;margin:12px 0}.ok{color:#a8dfb3}.bad{color:#ffaaa5}.wide{width:100%;margin-top:8px}.small{font-size:11px;color:var(--muted);line-height:1.5}
footer{text-align:center;color:#696970;font-size:10px;padding:28px 0 10px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}main{padding:28px 24px}.hero h1{font-size:42px}}
</style></head><body>
<header><div class="top"><div><div class="brand">CINEMA<span>.</span></div><div class="tag">YOUR PERSONAL SCREENING ROOM</div></div><div class="muted" id="headerCount">0 в коллекции</div></div></header>
<main id="app"></main>
<nav><button data-tab="catalog" class="active"><b>⌕</b>Каталог</button><button data-tab="collection"><b>▤</b>Коллекция</button><button data-tab="profile"><b>◉</b>Профиль</button><button data-tab="settings"><b>⚙</b>Настройки</button></nav>
<script>
const TMDB="https://api.themoviedb.org/3", IMG="https://image.tmdb.org/t/p/w500";
const sample=[
{id:101,title:"Интерстеллар",year:2014,type:"Фильм",poster:null,overview:"Путешествие за пределы нашей галактики."},
{id:102,title:"Очень странные дела",year:2016,type:"Сериал",poster:null,overview:"Таинственные события в маленьком городе."},
{id:103,title:"Начало",year:2010,type:"Фильм",poster:null,overview:"Границы сна и реальности."},
{id:104,title:"Атака титанов",year:2013,type:"Аниме",poster:null,overview:"История человечества за стенами."}
];
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem("cinema2_"+k))??d}catch{return d}};
let cfg=read("config",{tmdb:"",supabaseUrl:"",supabaseKey:""}), saved=read("collection",[]), ratings=read("ratings",{}), user=read("user","CINEMA USER"), tab="catalog",filter="Все",query="",results=[],loading=false,session=read("session",null),catalog=read("catalog",sample),status="";
const persist=()=>{for(const [k,v] of Object.entries({config:cfg,collection:saved,ratings,user,catalog,session}))localStorage.setItem("cinema2_"+k,JSON.stringify(v));};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const typeLabel=t=>t==="movie"?"Фильм":t==="tv"?"Сериал":t;
const normalized=x=>({id:String(x.id),title:x.title||x.name||"Без названия",year:(x.release_date||x.first_air_date||"").slice(0,4),type:x.media_type==="tv"||x.type==="Сериал"?"Сериал":x.media_type==="movie"||x.type==="Фильм"?"Фильм":x.type||"Аниме",poster:x.poster_path?IMG+x.poster_path:null,overview:x.overview||"",original:x.original_title||x.original_name||""});
function card(x){let has=saved.some(y=>String(y.id)===String(x.id));return `<article class="card">${x.poster?`<img class="poster" loading="lazy" src="${esc(x.poster)}" alt="Постер ${esc(x.title)}">`:`<div class="poster placeholder">${esc(x.title)}</div>`}<div class="info"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.year||"Год неизвестен")} · ${esc(x.type)}</div><div class="actions"><button class="btn ${has?"":"primary"}" onclick="toggleSave('${esc(x.id)}')">${has?"✓ В коллекции":"+ Добавить"}</button><button class="btn" onclick="rate('${esc(x.id)}')">${ratings[x.id]?"★ "+ratings[x.id]:"☆"}</button></div></div></article>`}
function allItems(){return [...catalog,...saved].filter((x,i,a)=>a.findIndex(y=>String(y.id)===String(x.id))===i)}
function listRated(){return saved.filter(x=>ratings[x.id])}
async function tmdbSearch(q){if(!cfg.tmdb){status="Добавь TMDB API Read Access Token в настройках, чтобы включить живой поиск.";results=[];render();return}loading=true;render();try{let url=TMDB+"/search/multi?query="+encodeURIComponent(q)+"&include_adult=false&language=ru-RU&page=1";let r=await fetch(url,{headers:{Authorization:"Bearer "+cfg.tmdb,accept:"application/json"}});if(!r.ok)throw Error("TMDB ответил "+r.status);let j=await r.json();results=(j.results||[]).filter(x=>["movie","tv"].includes(x.media_type)).map(normalized);status=""}catch(e){status="Не удалось загрузить каталог: "+e.message;results=[]}loading=false;render()}
function render(){document.getElementById("headerCount").textContent=saved.length+" в коллекции";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let app=document.getElementById("app");
if(tab==="catalog"){let list=query?results:catalog.filter(x=>filter==="Все"||x.type===filter);app.innerHTML=`<section class="hero"><div class="eyebrow">Твоя личная библиотека</div><h1>Истории, которые остаются.</h1><p>Ищи фильмы и сериалы, сохраняй их и выставляй оценки.</p></section><div class="search">⌕ <input id="search" placeholder="Поиск в большой базе TMDB..." value="${esc(query)}"></div><div class="filters">${["Все","Фильм","Сериал","Аниме"].map(f=>`<button class="chip ${filter===f?"active":""}" data-filter="${f}">${f}</button>`).join("")}</div>${status?`<div class="notice">${esc(status)}</div>`:""}<div class="sectionhead"><h2>${query?"Результаты поиска":"Попробуй начать"}</h2><span class="muted">${loading?"Загрузка…":list.length+" результатов"}</span></div><div class="grid">${list.map(card).join("")||'<div class="empty">Введи название для поиска по базе фильмов и сериалов.</div>'}</div><footer>CINEMA · ДАННЫЕ О ФИЛЬМАХ ПРЕДОСТАВЛЯЕТ TMDB</footer>`;
let timer;document.getElementById("search").addEventListener("input",e=>{query=e.target.value;clearTimeout(timer);timer=setTimeout(()=>{if(query.trim())tmdbSearch(query.trim());else{results=[];status="";render()}},450)});document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;query="";results=[];render()});
}else if(tab==="collection"){app.innerHTML=`<section class="hero"><div class="eyebrow">Твоя библиотека</div><h1>Моя коллекция.</h1><p>Твои фильмы, сериалы и личные оценки.</p></section><div class="stats"><div class="stat"><strong>${saved.length}</strong><span>Всего</span></div><div class="stat"><strong>${saved.filter(x=>x.type==="Фильм").length}</strong><span>Фильмы</span></div><div class="stat"><strong>${saved.filter(x=>x.type!=="Фильм").length}</strong><span>Сериалы / аниме</span></div></div><div class="grid">${saved.map(card).join("")||'<div class="empty">Коллекция пока пуста.<br>Найди произведения в каталоге и добавь их сюда.</div>'}</div><footer>ДАННЫЕ СОХРАНЯЮТСЯ НА ЭТОМ УСТРОЙСТВЕ ИЛИ В ТВОЁМ SUPABASE-ПРОФИЛЕ</footer>`}
else if(tab==="profile"){let rated=listRated(),avg=rated.length?(rated.reduce((s,x)=>s+Number(ratings[x.id]),0)/rated.length).toFixed(1):"—";app.innerHTML=`<section class="hero"><div class="eyebrow">Личный профиль</div><h1>Твой мир кино.</h1></section><div class="profilebox"><div class="avatar">${esc(user.slice(0,1).toUpperCase())}</div><h2 style="margin:0 0 5px">${esc(user)}</h2><div class="muted">${session?.user?.email?esc(session.user.email):"Локальный профиль"}</div><button class="btn" style="margin-top:15px;max-width:180px" onclick="editName()">Изменить имя</button></div><div class="stats"><div class="stat"><strong>${saved.length}</strong><span>В коллекции</span></div><div class="stat"><strong>${rated.length}</strong><span>Оценено</span></div><div class="stat"><strong>${avg}</strong><span>Средняя оценка</span></div></div><div class="notice">${session?"Аккаунт подключён.":"Пока используется локальный профиль. Подключи Supabase в настройках для регистрации и облачной синхронизации."}</div>`}
else renderSettings(app)}
function renderSettings(app){app.innerHTML=`<section class="hero"><div class="eyebrow">Настройки CINEMA</div><h1>Подключения.</h1><p>Подключи источники данных, чтобы включить расширенные возможности.</p></section><div class="panel"><h3 style="margin:0 0 6px">Каталог фильмов — TMDB</h3><div class="small">TMDB предоставляет поиск и постеры фильмов и сериалов. Создай API Read Access Token в своём аккаунте TMDB и вставь его ниже.</div><label class="label">TMDB API Read Access Token</label><input class="field" id="tmdb" type="password" placeholder="Вставь токен TMDB" value="${esc(cfg.tmdb)}"><button class="btn primary wide" onclick="saveConfig()">Сохранить настройки TMDB</button><div class="small"><a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener" style="color:#ddd">Получить ключ на TMDB ↗</a></div></div><div class="panel"><h3 style="margin:0 0 6px">Аккаунт и облачная коллекция</h3><div class="small">Создай проект Supabase, затем вставь Project URL и anon/public key. Ключ service_role сюда добавлять нельзя.</div><label class="label">Supabase Project URL</label><input class="field" id="surl" placeholder="https://xxxx.supabase.co" value="${esc(cfg.supabaseUrl)}"><label class="label">Supabase anon / publishable key</label><input class="field" id="skey" type="password" placeholder="Публичный anon key" value="${esc(cfg.supabaseKey)}"><button class="btn primary wide" onclick="saveConfig()">Сохранить подключение</button><div id="authArea">${authMarkup()}</div></div><div class="notice">Приватность: настройки и коллекция сейчас хранятся в браузере. Если включишь облако, данные аккаунта будут храниться в твоём проекте Supabase. Не вставляй сюда пароль от почты или секретный service_role key.</div><button class="btn wide" onclick="exportData()">Экспортировать коллекцию JSON</button><button class="btn wide" onclick="importData()">Импортировать коллекцию JSON</button><footer>CINEMA · НАСТРОЙКИ</footer>`}
function authMarkup(){if(session?.access_token)return `<div class="notice ok">Вход выполнен: ${esc(session.user?.email||"аккаунт")}</div><button class="btn wide" onclick="syncCloud()">Синхронизировать коллекцию</button><button class="btn wide" onclick="logout()">Выйти</button>`;return `<label class="label">Электронная почта</label><input class="field" id="email" type="email" placeholder="name@example.com"><label class="label">Пароль</label><input class="field" id="password" type="password" placeholder="Минимум 6 символов"><button class="btn primary wide" onclick="auth('signup')">Создать аккаунт</button><button class="btn wide" onclick="auth('login')">Войти</button><div class="small">Регистрация требует подтверждения почты, если оно включено в настройках Supabase.</div>`}
function saveConfig(){cfg.tmdb=document.getElementById("tmdb")?.value.trim()||"";cfg.supabaseUrl=document.getElementById("surl")?.value.trim().replace(/\/$/,"")||"";cfg.supabaseKey=document.getElementById("skey")?.value.trim()||"";persist();status="Настройки сохранены.";render()}
function toggleSave(id){let x=allItems().find(y=>String(y.id)===String(id));if(!x)return;if(saved.some(y=>String(y.id)===String(id)))saved=saved.filter(y=>String(y.id)!==String(id));else saved.push(x);persist();render()}
function rate(id){let x=allItems().find(y=>String(y.id)===String(id));if(!x)return;if(!saved.some(y=>String(y.id)===String(id)))saved.push(x);let v=prompt("Оценка от 1 до 10",ratings[id]||"");if(v!==null){let n=Number(v);if(Number.isInteger(n)&&n>=1&&n<=10)ratings[id]=n;else alert("Введи число от 1 до 10.")}persist();render()}
function editName(){let n=prompt("Имя профиля",user);if(n?.trim()){user=n.trim().slice(0,30);persist();render()}}
async function auth(mode){if(!cfg.supabaseUrl||!cfg.supabaseKey)return alert("Сначала сохрани Supabase URL и anon key.");let email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||password.length<6)return alert("Введи почту и пароль не короче 6 символов.");try{let r=await fetch(cfg.supabaseUrl+"/auth/v1/"+(mode==="signup"?"signup":"token?grant_type=password"),{method:"POST",headers:{"Content-Type":"application/json","apikey":cfg.supabaseKey},body:JSON.stringify({email,password})});let j=await r.json();if(!r.ok)throw Error(j.msg||j.message||j.error_description||"Ошибка авторизации");if(j.access_token){session=j;persist();await syncCloud();render()}else alert("Аккаунт создан. Проверь почту, если требуется подтверждение, затем войди.")}catch(e){alert("Не удалось выполнить действие: "+e.message)}}
async function cloudRequest(path,method="GET",body=null){let r=await fetch(cfg.supabaseUrl+"/rest/v1/"+path,{method,headers:{"Content-Type":"application/json","apikey":cfg.supabaseKey,"Authorization":"Bearer "+session.access_token,"Prefer":"resolution=merge-duplicates,return=minimal"},body:body?JSON.stringify(body):null});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function syncCloud(){if(!session?.access_token)return alert("Сначала войди в аккаунт.");try{let payload=saved.map(x=>({user_id:session.user.id,media_id:String(x.id),media_data:x,rating:ratings[x.id]||null}));await cloudRequest("cinema_items?on_conflict=user_id,media_id","POST",payload);alert("Синхронизация завершена.");}catch(e){alert("Ошибка синхронизации: "+e.message+"\nПроверь SQL-схему и Row Level Security из файла README.")}}
async function logout(){session=null;persist();render()}
function exportData(){let blob=new Blob([JSON.stringify({saved,ratings,user},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cinema-collection.json";a.click();URL.revokeObjectURL(a.href)}
function importData(){let i=document.createElement("input");i.type="file";i.accept="application/json";i.onchange=async()=>{try{let j=JSON.parse(await i.files[0].text());if(Array.isArray(j.saved))saved=j.saved;if(j.ratings)ratings=j.ratings;if(j.user)user=j.user;persist();render();alert("Коллекция импортирована.")}catch(e){alert("Не удалось прочитать файл.")}};i.click()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
render();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
